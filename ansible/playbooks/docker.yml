---
- name: Installer Docker Engine et le plugin Compose sur les Workers
  hosts: workers
  become: true
  tasks:
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Installer les paquets prérequis
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present

    - name: Créer le répertoire des clés apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG officielle Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Définir le dépôt Docker (écrase une éventuelle ancienne définition erronée)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: '0644'
        content: |
          deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
      register: docker_repo

    - name: Mettre à jour le cache apt après ajout du dépôt Docker
      ansible.builtin.apt:
        update_cache: true
      when: docker_repo is changed

    - name: Installer Docker Engine, CLI et le plugin Compose
      ansible.builtin.apt:
        #update_cache: true
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present

    - name: Démarrer et activer Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Ajouter l'utilisateur vagrant au groupe docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true