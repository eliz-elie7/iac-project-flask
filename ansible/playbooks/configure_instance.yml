- name: Configurer une instance louée
  hosts: all
  gather_facts: false
  tasks:
    - name: Attendre que le conteneur réponde
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Injecter la clé publique de l'utilisateur
      ansible.posix.authorized_key:
        user: root
        key: "{{ pubkey }}"
        state: present