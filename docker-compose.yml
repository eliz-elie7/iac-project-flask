services:
  web:
    build: ./app
    network_mode: host
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/code

  db:
    image: postgres:16
    env_file:
      - .env
    environment:
      - POSTGRES_USER=iac_user
      - POSTGRES_PASSWORD=iac_pass
      - POSTGRES_DB=iac_project
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: