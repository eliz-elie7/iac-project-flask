{% extends "base.html" %}
{% block title %}Créer un compte · Location d'instances{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<div class="panel">
    <h1>Créer un compte</h1>
    <p class="hint" style="margin-bottom:1.5rem;">Il vous faut un compte pour louer des instances accessibles en SSH.</p>
    <form method="POST">
        <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-block">Créer mon compte</button>
    </form>
</div>
<p class="auth-switch">Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a></p>
{% endblock %}
