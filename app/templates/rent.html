{% extends "base.html" %}
{% block content %}
<h1>Louer une instance</h1>
<form method="POST">
    <label>Distribution</label>
    <select name="distribution" required>
        {% for d in distributions %}
        <option value="{{ d.name }}">{{ d.name }}</option>
        {% endfor %}
    </select>

    <label>Durée (heures)</label>
    <input type="number" name="duration_hours" min="1" max="72" value="1" required>

    <button type="submit">Louer</button>
</form>
<a href="{{ url_for('dashboard.index') }}">Retour au dashboard</a>
{% endblock %}
